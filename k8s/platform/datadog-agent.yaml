apiVersion: v1
kind: ServiceAccount
metadata:
  name: datadog-agent
  namespace: platform
  labels:
    app.kubernetes.io/name: datadog-agent
    app.kubernetes.io/part-of: oficina-mecanica

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: datadog-agent
  labels:
    app.kubernetes.io/name: datadog-agent
    app.kubernetes.io/part-of: oficina-mecanica

# Read-only permissions feeding pod metrics, replica state, and tag enrichment.
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/spec, nodes/proxy, nodes/stats]
    verbs: [get, list, watch]

  - apiGroups: [""]
    resources: [pods, services, endpoints, namespaces, events]
    verbs: [get, list, watch]

  - apiGroups: [apps]
    resources: [deployments, replicasets, daemonsets, statefulsets]
    verbs: [get, list, watch]

  - nonResourceURLs: [/metrics, /healthz, /version]
    verbs: [get]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: datadog-agent
  labels:
    app.kubernetes.io/name: datadog-agent
    app.kubernetes.io/part-of: oficina-mecanica

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: datadog-agent

subjects:
  - kind: ServiceAccount
    name: datadog-agent
    namespace: platform

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: datadog-agent
  namespace: platform
  labels:
    app.kubernetes.io/name: datadog-agent
    app.kubernetes.io/part-of: oficina-mecanica

spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: datadog-agent

  template:
    metadata:
      labels:
        app.kubernetes.io/name: datadog-agent
        app.kubernetes.io/part-of: oficina-mecanica

    spec:
      serviceAccountName: datadog-agent

      # The agent reaches the node kubelet via DD_KUBERNETES_KUBELET_HOST.
      hostNetwork: false
      dnsPolicy: ClusterFirst

      tolerations:
        - operator: Exists

      containers:
        - name: agent
          image: gcr.io/datadoghq/agent:7.83.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: otlp-http
              containerPort: 4318
              protocol: TCP

          env:
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-secret
                  key: DD_API_KEY

            - name: DD_SITE
              value: us5.datadoghq.com

            - name: DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT
              value: 0.0.0.0:4318

            - name: HOST_PROC
              value: /proc

            - name: DD_APM_ENABLED
              value: "true"

            - name: DD_LOGS_ENABLED
              value: "true"
            - name: DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL
              value: "true"

            - name: DD_CONTAINER_EXCLUDE_LOGS
              value: "name:mailhog name:agent name:kube-proxy"

            # The orchestrator_pod check requires a Cluster Agent, which is not deployed here.
            - name: DD_ORCHESTRATOR_EXPLORER_ENABLED
              value: "false"

            - name: DD_KUBELET_TLS_VERIFY
              value: "false"

            - name: DD_CLUSTER_NAME
              value: oficina-mecanica

            - name: DD_KUBERNETES_KUBELET_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 512Mi

          # EKS AL2023 nodes run containerd without /var/run/docker.sock; container
          # metadata comes from the kubelet API via DD_KUBERNETES_KUBELET_HOST.
          volumeMounts:
            - name: procdir
              mountPath: /host/proc
              readOnly: true
            - name: cgroups
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            - name: pointerdir
              mountPath: /opt/datadog-agent/run
            - name: logpodpath
              mountPath: /var/log/pods
              readOnly: true

      volumes:
        - name: procdir
          hostPath:
            path: /proc
        - name: cgroups
          hostPath:
            path: /sys/fs/cgroup
        # Persists log offsets across agent restarts.
        - name: pointerdir
          hostPath:
            path: /var/lib/datadog-agent/run
            type: DirectoryOrCreate
        - name: logpodpath
          hostPath:
            path: /var/log/pods
